# ─────────────────────────────────────────────
# LiveKit Configuration for CareBell MeetWithFriends
# Auto-quality: 360p → 480p → 720p → 1080p
# ─────────────────────────────────────────────

port: 7880
bind: 0.0.0.0

# API keys used by backend
keys:
  carebell: supersecret

rtc:
  # STUN is enough because users connect only from home/public networks
  # TURN can be added later if you want worldwide reliability
  stun_servers:
    - stun:stun.l.google.com:19302
    - stun:stun1.l.google.com:19302

  # Allow max 1080p input from devices
  video:
    codec: h264
    max_bitrate: 2500000     # 2.5 Mbps for 1080p
    # Simulcast = LiveKit auto creates multiple layers
    # 360p / 480p / 720p / 1080p
    simulcast: true
    layers:
      - quality: low
        width: 640
        height: 360
        bitrate: 350000
      - quality: medium
        width: 854
        height: 480
        bitrate: 500000
      - quality: high
        width: 1280
        height: 720
        bitrate: 900000
      - quality: full
        width: 1920
        height: 1080
        bitrate: 2000000

  # Audio settings (Opus only)
  audio:
    codec: opus
    max_bitrate: 32000
    dtx: true           # Reduce bandwidth when quiet

# Adaptive stream (receiver-side downscaling)
# If device is weak → LiveKit auto chooses a lower layer
# If network is slow → auto reduces resolution/fps
video:
  adaptive_stream: true

# CPU/Network based video optimization
publisher:
  default_bitrate: 500000     # what the client starts with
  maximum_bitrate: 2500000    # up to 1080p
  min_bitrate: 100000         # fallback for weak devices
  cpu_cost:
    # Tablets/phones get less CPU usage for higher resolutions
    # (prevents overheating and freezing)
    cpu_low: 60
    cpu_high: 95

# Limit room size (good for SFU stability)
# Your existing code already limits to 10 participants
room:
  max_participants: 10

# Timeouts / stability tweaks
timeouts:
  participant_inactivity_timeout: 30s
  ice_lite: true

logging:
  json: false
  level: info
